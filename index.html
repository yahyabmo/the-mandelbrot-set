<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mandelbrot Odyssey</title>
    <meta name="description" content="A real-time journey into the Mandelbrot set, computed live on your graphics card." />
    <meta name="theme-color" content="#0a0b0f" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0b0f'/><circle cx='19' cy='16' r='7' fill='%23f6f3ea'/><circle cx='9.5' cy='16' r='3.5' fill='%23f6f3ea'/><circle cx='4.6' cy='16' r='1.3' fill='%23efc879'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="stage" aria-label="The Mandelbrot set. Scroll to zoom, drag to move."></canvas>
    <div class="reticle" aria-hidden="true"></div>

    <header class="plate brand">
      <div class="brand-title">Mandelbrot <em>Odyssey</em></div>
      <div class="brand-sub">An atlas of the complex plane</div>
    </header>

    <div class="plate gauge" aria-hidden="true">
      <div class="gauge-label">depth</div>
      <div class="gauge-track" id="gauge-track">
        <div class="gauge-mark" id="gauge-mark"></div>
      </div>
    </div>

    <button class="plate panel-toggle" id="panel-toggle" type="button" aria-label="Show or hide the index" aria-expanded="true">
      <span>Index</span>
    </button>

    <aside class="plate panel" id="panel" aria-label="Controls">
      <section>
        <h2><span>I</span> Places</h2>
        <div class="picker" id="place-picker">
          <button type="button" class="picker-button" id="place-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="place-list">
            <kbd id="place-key">1</kbd>
            <span class="picker-text"><b id="place-name"></b><span id="place-blurb"></span></span>
            <i class="picker-chevron" aria-hidden="true"></i>
          </button>
          <ol class="picker-list" id="place-list" role="listbox" tabindex="-1" aria-label="Places" hidden></ol>
        </div>
      </section>
      <section>
        <h2><span>II</span> Colours</h2>
        <div class="palettes" id="palettes"></div>
        <label class="slider">
          <span>Density <output id="density-out"></output></span>
          <input id="density" type="range" min="-1" max="1" step="0.01" value="0" />
        </label>
        <label class="slider">
          <span>Shift <output id="offset-out"></output></span>
          <input id="offset" type="range" min="0" max="1" step="0.001" value="0" />
        </label>
        <div class="row">
          <button type="button" class="toggle" id="cycle" aria-pressed="false">Flow</button>
          <input id="cycle-speed" type="range" min="0.02" max="0.6" step="0.01" value="0.12" aria-label="Flow speed" />
        </div>
      </section>
      <section>
        <h2><span>III</span> Detail</h2>
        <label class="slider">
          <span>Iterations <output id="detail-out"></output></span>
          <input id="detail" type="range" min="-2" max="2" step="0.01" value="0" />
        </label>
        <div class="row">
          <button type="button" class="toggle" id="smooth" aria-pressed="true">Smooth edges</button>
        </div>
      </section>
      <section>
        <h2><span>IV</span> Keep</h2>
        <div class="row">
          <button type="button" class="action" id="copy-link">Copy link</button>
          <button type="button" class="action" id="save-image">Save image</button>
          <button type="button" class="action" id="reset">Reset</button>
        </div>
      </section>
    </aside>

    <div class="plate readout" id="hud" aria-live="off">
      <div class="readout-label">magnification</div>
      <div class="readout-zoom" id="hud-zoom">1.00×</div>
      <dl>
        <dt>re</dt><dd id="hud-re"></dd>
        <dt>im</dt><dd id="hud-im"></dd>
        <dt>iterations</dt><dd id="hud-iter"></dd>
        <dt>engine</dt><dd id="hud-engine"></dd>
        <dt>image</dt><dd id="hud-image"></dd>
        <dt>fps</dt><dd id="hud-fps"></dd>
      </dl>
      <p class="limit" id="hud-limit" hidden>Deepest zoom of this version.</p>
    </div>

    <div class="plate scalebar" aria-hidden="true">
      <div class="scalebar-rule"></div>
      <div class="scalebar-text" id="scale-text"></div>
    </div>

    <p class="plate hint" id="hint">
      <kbd>scroll</kbd> zoom <kbd>drag</kbd> move <kbd>double-click</kbd> dive <kbd>H</kbd> hide <kbd>1</kbd>–<kbd>8</kbd> places
    </p>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="fatal" id="fatal" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
